services:
  # ==============================================================
  # 1. DATABASE: Microsoft SQL Server 2022 Linux
  # ==============================================================
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: webcafe_db
    user: root
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-WebCafe@Secured2026!}"
      MSSQL_PID: "Express"
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql/data
    networks:
      - webcafe_network
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD:-WebCafe@Secured2026!}\" -C -Q \"SELECT 1\" || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD:-WebCafe@Secured2026!}\" -Q \"SELECT 1\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 25s

  # ==============================================================
  # 2. BACKEND: ASP.NET Core .NET 9 Web API
  # ==============================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: webcafe_backend
    restart: unless-stopped
    ports:
      - "5277:5277"
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ASPNETCORE_URLS: "http://+:5277"
      ConnectionStrings__DefaultConnection: "Server=db,1433;Database=WebCafeDB;User Id=sa;Password=${MSSQL_SA_PASSWORD:-WebCafe@Secured2026!};TrustServerCertificate=True;MultipleActiveResultSets=true;"
      Database__AutoMigrate: "true"
      Jwt__SecretKey: "${JWT_SECRET_KEY:-WebCafeProductionSecureKey2026_MustBeAtLeast64CharactersLong_VeryStrongSecretKey!}"
      Jwt__Issuer: "WebCafeBackend"
      Jwt__Audience: "WebCafeClients"
      Cors__AllowedOrigins__0: "http://localhost"
      Cors__AllowedOrigins__1: "http://127.0.0.1"
      Cors__AllowedOrigins__2: "https://localhost"
      Cors__AllowedOrigins__3: "https://ai-smartserve.io.vn"
      Cors__AllowedOrigins__4: "https://www.ai-smartserve.io.vn"
      Cors__AllowedOrigins__5: "http://ai-smartserve.io.vn"
      Cors__AllowedOrigins__6: "http://www.ai-smartserve.io.vn"
      Cors__AllowedOrigins__7: "${FRONTEND_DOMAIN_ORIGIN:-http://localhost}"
      Frontend__PublicUrl: "${FRONTEND_PUBLIC_URL:-https://www.ai-smartserve.io.vn}"
      PayOS__ClientId: "${PAYOS_CLIENT_ID:-YOUR_PAYOS_CLIENT_ID}"
      PayOS__ApiKey: "${PAYOS_API_KEY:-YOUR_PAYOS_API_KEY}"
      PayOS__ChecksumKey: "${PAYOS_CHECKSUM_KEY:-YOUR_PAYOS_CHECKSUM_KEY}"
      Email__SmtpHost: "${EMAIL_SMTP_HOST:-smtp.gmail.com}"
      Email__SmtpPort: "${EMAIL_SMTP_PORT:-587}"
      Email__Username: "${EMAIL_USERNAME:-webaismartserve@gmail.com}"
      Email__Password: "${EMAIL_PASSWORD:-iyoqexttdexeoqqf}"
      Email__From: "${EMAIL_FROM:-webaismartserve@gmail.com}"
      Email__EnableSsl: "${EMAIL_ENABLE_SSL:-true}"
      Email__ExposeVerificationUrl: "false"
    networks:
      - webcafe_network

  # ==============================================================
  # 3. FRONTEND: React + Vite + Nginx Reverse Proxy
  # ==============================================================
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_BASE_URL: "/api"
        VITE_HUB_URL: "/hubs/orders"
        VITE_GA_ID: "${VITE_GA_ID:-G-NJFPHGJW2P}"
    container_name: webcafe_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${PORT:-80}:80"
    networks:
      - webcafe_network

networks:
  webcafe_network:
    driver: bridge

volumes:
  mssql_data:
    driver: local
