<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="apple-touch-icon" href="/favicon.svg?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F6F1E7" />
    <meta name="description" content="Khám phá thực đơn AI-SMARTSERVE, chọn đồ uống yêu thích và đặt món trực tuyến tại quán cà phê." />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://www.ai-smartserve.io.vn/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AI-SMARTSERVE" />
    <meta property="og:title" content="AI-SMARTSERVE" />
    <meta property="og:description" content="Khám phá thực đơn, chọn món và đặt đồ uống trực tuyến." />
    <meta property="og:url" content="https://www.ai-smartserve.io.vn/" />
    <link rel="ai-catalog" href="/ai-catalog.json" />
    <title>AI-SMARTSERVE</title>

    <!-- Preconnect critical resource origins (strictly <= 4 to prevent connection bloat) -->
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://api.ai-smartserve.io.vn" crossorigin />
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />

    <!-- Non-blocking Google Fonts & Material Symbols for instant FCP -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" media="print" onload="this.media='all'" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" media="print" onload="this.media='all'" />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" />
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" />
    </noscript>

    <!-- Google Analytics 4 (deferred to idle/first interaction to protect LCP) -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', '%VITE_GA_ID%', { send_page_view: false });

      function loadGTM() {
        if (window.__gtmLoaded) return;
        window.__gtmLoaded = true;
        var gaId = '%VITE_GA_ID%';
        if (gaId && gaId.indexOf('%') === -1) {
          var script = document.createElement('script');
          script.src = 'https://www.googletagmanager.com/gtag/js?id=' + gaId;
          script.async = true;
          document.head.appendChild(script);
        }
      }
      ['pointerdown', 'scroll', 'keydown', 'touchstart'].forEach(function(evt) {
        window.addEventListener(evt, loadGTM, { once: true, passive: true });
      });
      if ('requestIdleCallback' in window) {
        window.requestIdleCallback(function() { setTimeout(loadGTM, 3500); });
      } else {
        setTimeout(loadGTM, 4000);
      }
    </script>

    <!-- Immediate theme hydration to prevent flash of light theme -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('ai_smartserve_theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (saved === 'dark' || ((!saved || saved === 'system') && prefersDark)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body style="margin: 0; padding: 0;">
    <div id="root">
      <!-- Instant App Shell Skeleton for sub-second FCP -->
      <div style="min-height: 100vh; background-color: #F6F1E7; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
        <header style="height: 64px; border-bottom: 1px solid rgba(85,55,34,0.08); background: rgba(246,241,231,0.9); display: flex; align-items: center; justify-content: space-between; padding: 0 16px;">
          <div style="font-size: 18px; font-weight: 800; color: #69452f; display: flex; align-items: center; gap: 8px;">
            <span>☕ AI-SMARTSERVE</span>
          </div>
          <div style="width: 32px; height: 32px; border-radius: 50%; background: rgba(85,55,34,0.1);"></div>
        </header>
        <div style="max-width: 1200px; margin: 0 auto; padding: 20px 16px;">
          <div style="height: 42px; width: 210px; background: #eee5d6; border-radius: 999px; margin: 0 auto 18px;"></div>
          <div style="height: 74px; background: linear-gradient(120deg, #35251b, #69452f); border-radius: 18px; margin-bottom: 18px;"></div>
          <div style="display: flex; gap: 9px; overflow: hidden; margin-bottom: 20px;">
            <div style="height: 36px; width: 105px; flex: none; background: #e7e3cb; border-radius: 999px;"></div>
            <div style="height: 36px; width: 132px; flex: none; background: #fffdfa; border: 1px solid #e8ded1; border-radius: 999px;"></div>
            <div style="height: 36px; width: 132px; flex: none; background: #fffdfa; border: 1px solid #e8ded1; border-radius: 999px;"></div>
          </div>
          <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px;">
            <div style="height: 240px; background: #fffdfa; border-radius: 16px; border: 1px solid #eee5db;"></div>
            <div style="height: 240px; background: #fffdfa; border-radius: 16px; border: 1px solid #eee5db;"></div>
            <div style="height: 240px; background: #fffdfa; border-radius: 16px; border: 1px solid #eee5db;"></div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
