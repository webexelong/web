<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F6F1E7" />
    <meta name="description" content="AI-SMARTSERVE - Nền tảng quản lý quán cà phê, nhà hàng và giải pháp gọi món thông minh tích hợp trợ lý AI Sommelier." />
    <meta name="robots" content="index, follow" />
    <title>AI-SMARTSERVE | Handcrafted Menu</title>

    <!-- Preconnect resource origins -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://images.unsplash.com" />

    <!-- Non-blocking Google Fonts & Material Symbols for instant FCP -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" media="print" onload="this.media='all'" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" media="print" onload="this.media='all'" />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" />
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" />
    </noscript>

    <!-- Google Analytics 4 (deferred to preserve initial paint thread) -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', '%VITE_GA_ID%', { send_page_view: false });

      // Load GA script only after page becomes idle to preserve FCP/LCP
      window.addEventListener('load', function() {
        var gaId = '%VITE_GA_ID%';
        if (gaId && gaId.indexOf('%') === -1) {
          var script = document.createElement('script');
          script.src = 'https://www.googletagmanager.com/gtag/js?id=' + gaId;
          script.async = true;
          document.head.appendChild(script);
        }
      });
    </script>
  </head>
  <body style="background-color: #F6F1E7; margin: 0; padding: 0;">
    <div id="root">
      <!-- Instant App Shell Skeleton for sub-second FCP -->
      <div style="min-height: 100vh; background-color: #F6F1E7; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
        <header style="height: 64px; border-bottom: 1px solid rgba(85,55,34,0.08); background: rgba(246,241,231,0.9); display: flex; align-items: center; justify-content: space-between; padding: 0 16px;">
          <div style="font-size: 18px; font-weight: 800; color: #69452f; display: flex; align-items: center; gap: 8px;">
            <span>☕ AI-SMARTSERVE</span>
          </div>
          <div style="width: 32px; height: 32px; border-radius: 50%; background: rgba(85,55,34,0.1);"></div>
        </header>
        <div style="max-width: 1200px; margin: 0 auto; padding: 16px;">
          <div style="height: 40px; background: #ffffff; border-radius: 999px; margin-bottom: 16px; border: 1px solid rgba(85,55,34,0.1);"></div>
          <div style="height: 112px; background: linear-gradient(135deg, #281E19, #3D2C24); border-radius: 16px; margin-bottom: 20px;"></div>
          <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 14px;">
            <div style="height: 220px; background: #ffffff; border-radius: 14px; border: 1px solid rgba(85,55,34,0.06);"></div>
            <div style="height: 220px; background: #ffffff; border-radius: 14px; border: 1px solid rgba(85,55,34,0.06);"></div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
